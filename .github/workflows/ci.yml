name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall src tests scripts

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: CLI smoke
        run: radar-transicao-energetica --arquivo examples\geracao_exemplo.csv --json --sem-cache
